name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  package:
    name: Publishable package
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run bundle
      - name: Bundle runs and reports its version
        run: node dist-bundle/devgu.mjs version
      - name: Bundle finds the vulnerable fixture and stays silent on the safe one
        run: |
          node dist-bundle/devgu.mjs scan fixtures/vulnerable --no-cache -q > /dev/null && exit 1 || test $? -eq 1
          node dist-bundle/devgu.mjs scan fixtures/safe --no-cache -q > /dev/null
      - run: npm pack ./dist-bundle --dry-run
